  <circle cx="1088" cy="82" r="6" fill="#2f6fa8"/>
  <circle cx="1110" cy="82" r="6" fill="#b7791f"/>
  <circle cx="1132" cy="82" r="6" fill="#cbd5e1"/>
  <text x="112" y="179" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" letter-spacing="8">SPICYWONDA</text>
</svg>

