<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Spicywonda</title>
  <desc id="desc">Professional slate banner displaying the Spicywonda alias.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e7edf4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7791f"/>
      <stop offset=".55" stop-color="#2f6fa8"/>
      <stop offset="1" stop-color="#cbd5e1"/>
